name: Inspect ZN-M2 (multi-tree)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
    - name: Scan trees
      run: |
        set +e
        scan() {
          NAME="$1"; URL="$2"
          echo; echo "################ $NAME ################"
          rm -rf t
          git clone --depth 1 "$URL" t 2>&1 | tail -2
          [ -d t ] || { echo "CLONE FAILED"; return; }
          cd t
          echo "branch: $(git rev-parse --abbrev-ref HEAD)  commit: $(git log -1 --format='%h %ad' --date=short)"

          echo "--- 1. 全仓库内容匹配 ---"
          grep -rniE "zn[_,-]?m2" target package 2>/dev/null | head -30
          echo "--- 1b. 文件名含 zn 的 dts/mk ---"
          find target -iname "*zn*" 2>/dev/null | head -20

          echo "--- 2. 设备块 ---"
          MK=$(grep -rlE "define Device/.*zn.?m2" target/linux 2>/dev/null | head -1)
          echo "mk file: $MK"
          if [ -n "$MK" ]; then
            sed -n '/^define Device\/.*zn.*m2/,/^endef/p' "$MK"
          fi

          echo "--- 3. dts 头部与 memory 节点 ---"
          DTS=$(grep -rlE 'zn,m2|zn-m2|zn_m2' target/linux --include=*.dts 2>/dev/null | head -1)
          [ -z "$DTS" ] && DTS=$(find target -iname "*zn*m2*.dts" | head -1)
          echo "dts: $DTS"
          if [ -n "$DTS" ]; then
            head -n 50 "$DTS"
            echo "... memory 相关:"
            grep -n -B1 -A4 "memory" "$DTS" || echo "(dts 内无 memory 节点)"
          fi

          echo "--- 4. dtsi memory 节点 ---"
          grep -rn -A4 "memory@" $(find target/linux/qualcommax -name "ipq6018*.dtsi") 2>/dev/null | head -20

          echo "--- 5. ipq60xx target.mk ---"
          cat target/linux/qualcommax/ipq60xx/target.mk 2>/dev/null

          echo "--- 6. NSS 相关 ---"
          ls package 2>/dev/null | grep -i nss | head
          grep -i nss feeds.conf.default
          grep -rl "qca-nss" target/linux/qualcommax/ipq60xx 2>/dev/null | head -3
          cd ..
        }

        scan "VIKINGYFY" https://github.com/VIKINGYFY/immortalwrt.git
        scan "qosmio"    https://github.com/qosmio/openwrt-ipq.git
        exit 0
